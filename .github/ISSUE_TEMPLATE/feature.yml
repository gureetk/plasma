name: Feature idea
description: Suggest something Plasma could do.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Plasma to do, and why?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you manage today
      description: What you do now, or which other app does this well.
