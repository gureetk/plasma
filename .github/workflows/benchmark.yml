name: Benchmarks

# Brief 6.7's budgets measured by the benchmark module (#127): cold start to Home, the Guide's
# scrolling, and key presses in the Guide, Live TV, Movies, Series and Home's rows, with a made-up
# source of 1,500 channels, 200,000 programs, 6,000 movies and 1,200 series, on an Android TV
# emulator. An emulator on GitHub's machines isn't a TV box, so its numbers show changes
# from one run to the next, not what a TV does: docs/testing.md says how to measure on the TV.
# Run by hand (Actions › Benchmarks › Run workflow), and on a pull request that changes them. By
# hand, it can instead build the two APKs to measure on a TV with, for the Plasma Benchmarks
# pre-release.
on:
  workflow_dispatch:
    inputs:
      for_a_tv:
        description: Build the APKs to measure on a TV, without the emulator, and put them on the Plasma Benchmarks pre-release
        type: boolean
        default: false
      only:
        description: Only these benchmark classes or tests, as StartupBenchmark, GuideBenchmark,LiveTvBenchmark or FirstOpenBenchmark#firstOpenOfLiveTv (all of them when empty)
        type: string
        default: ""
      compose_tracing:
        description: Name each composable in the traces, and say which took the main thread longest (slows what's measured)
        type: boolean
        default: false
      main_thread_samples:
        description: Write the main thread's stack into the traces every few ms, and say what it ran between frames (slows what's measured)
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - benchmark/**
      - app/src/benchmark/**
      - .github/workflows/benchmark.yml

permissions:
  contents: read

env:
  # As in build.yml: GitHub's release downloads, where Plasma's libmpv comes from, sometimes answer
  # 504 for minutes.
  GRADLE_RETRIES: -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=2000

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: ${{ !inputs.for_a_tv }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Fetch Gradle
        run: |
          for wait in 15 45 90 180; do
            ./gradlew --version --console=plain && exit 0
            echo "Fetching Gradle failed; trying again in $wait s"
            sleep "$wait"
          done
          ./gradlew --version --console=plain

      # Built before the emulator starts, so the two don't share the machine.
      - name: Build Plasma's benchmark build and the benchmarks
        run: ./gradlew $GRADLE_RETRIES :app:assembleBenchmark :benchmark:assembleBenchmark --console=plain

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Only the benchmark class asked for, when one is.
      - name: Choose the benchmarks
        env:
          ONLY: ${{ inputs.only }}
          COMPOSE_TRACING: ${{ inputs.compose_tracing }}
          MAIN_THREAD_SAMPLES: ${{ inputs.main_thread_samples }}
        run: |
          if [ "$MAIN_THREAD_SAMPLES" = "true" ]; then
            echo "SAMPLES_ARGUMENT=-Pandroid.testInstrumentationRunnerArguments.plasma.mainThreadSamples=true" >> "$GITHUB_ENV"
          else
            echo "SAMPLES_ARGUMENT=" >> "$GITHUB_ENV"
          fi
          if [ "$COMPOSE_TRACING" = "true" ]; then
            echo "TRACING_ARGUMENT=-Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.perfettoSdkTracing.enable=true" >> "$GITHUB_ENV"
            echo "COMPOSE_TRACING=true" >> "$GITHUB_ENV"
          else
            echo "TRACING_ARGUMENT=" >> "$GITHUB_ENV"
          fi
          if [ -z "$ONLY" ]; then
            echo "ONLY_ARGUMENT=" >> "$GITHUB_ENV"
          elif [[ "$ONLY" =~ ^[A-Za-z]+(#[A-Za-z]+)?(,[A-Za-z]+(#[A-Za-z]+)?)*$ ]]; then
            echo "ONLY_ARGUMENT=-Pandroid.testInstrumentationRunnerArguments.class=$(echo "$ONLY" | sed -E 's/(^|,)/\1ca.gureet.plasma.macrobenchmark./g')" >> "$GITHUB_ENV"
          else
            echo "::error::Not a benchmark class or test: $ONLY"
            exit 1
          fi

      # Android TV 14 at 1080p, as a Chromecast with Google TV has, without Google TV's own setup on
      # a new device. Animations stay on: they're part of what's measured.
      - name: Measure on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          disk-size: 6G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # What the device logged goes beside the results, for the steps after: with a buffer large
          # enough for the whole run, so that a start that failed early is still in it at the end.
          script: adb logcat -G 16M; ./gradlew $GRADLE_RETRIES :benchmark:connectedBenchmarkAndroidTest $ONLY_ARGUMENT $TRACING_ARGUMENT $SAMPLES_ARGUMENT --console=plain; status=$?; adb logcat -d > benchmark/build/logcat.txt; exit $status

      - name: Say why benchmarks failed
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("benchmark/build/outputs/androidTest-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      text = (problem.text or problem.get("message") or "").strip()
                      print(f"::error title={case.get('classname', '').rsplit('.', 1)[-1]}.{case.get('name')}::" + text.splitlines()[0][:900] if text else "")
                      print("\n".join(text.splitlines()[:40]))
          EOF
          if [ -f benchmark/build/logcat.txt ]; then
            echo "== The device's log, Plasma's and the benchmarks' lines"
            grep -E "AndroidRuntime|TestRunner|Benchmark|ActivityManager: (Start|Process|Killing)|ca\.gureet\.plasma|System.err|FATAL" benchmark/build/logcat.txt \
              | grep -v AccessibilityNodeInfoDumper | tail -300
          fi

      # What each benchmark's first trace holds of what its metrics read, in Plasma's own process:
      # its frames and how long they take on each thread, its key sections and its reportFullyDrawn,
      # so a metric that finds nothing says why, and for a cold start, where its time goes. Then
      # what the benchmarks logged as they waited.
      - name: Look into the traces
        if: always()
        continue-on-error: true
        run: |
          pip install --quiet perfetto
          python3 - <<'EOF'
          import bisect, glob, re
          from perfetto.trace_processor import TraceProcessor

          APP = "ca.gureet.plasma.benchmark"
          IN_APP = f"JOIN thread_track ON slice.track_id = thread_track.id JOIN thread USING(utid) JOIN process USING(upid) WHERE process.name = '{APP}'"
          checks = [
              ("Plasma running", f"SELECT COUNT(*) AS n FROM process WHERE name = '{APP}'"),
              ("frames on its main thread", f"SELECT COUNT(*) AS n FROM slice {IN_APP} AND thread.tid = process.pid AND slice.name LIKE 'Choreographer#doFrame%'"),
              ("frames on its RenderThread", f"SELECT COUNT(*) AS n FROM slice {IN_APP} AND thread.name = 'RenderThread' AND slice.name LIKE 'DrawFrame%'"),
              ("a frame's average on its main thread, ms", f"SELECT ROUND(AVG(slice.dur) / 1e6, 1) AS n FROM slice {IN_APP} AND thread.tid = process.pid AND slice.name LIKE 'Choreographer#doFrame%'"),
              ("a frame's average on its RenderThread, ms", f"SELECT ROUND(AVG(slice.dur) / 1e6, 1) AS n FROM slice {IN_APP} AND thread.name = 'RenderThread' AND slice.name LIKE 'DrawFrame%'"),
              ("its frames on the frame timeline", f"SELECT COUNT(*) AS n FROM actual_frame_timeline_slice JOIN process USING(upid) WHERE process.name = '{APP}'"),
              ("keys it took", f"SELECT COUNT(*) AS n FROM slice {IN_APP} AND slice.name LIKE 'deliverInputEvent%'"),
              ("its key sections", "SELECT COUNT(*) AS n FROM slice WHERE name = 'Plasma.keyToDraw'"),
              ("its reportFullyDrawn", f"SELECT COUNT(*) AS n FROM slice {IN_APP} AND slice.name LIKE 'reportFullyDrawn%'"),
          ]

          def one(tp, sql):
              rows = list(tp.query(sql))
              return rows[0].t if rows else None

          def startup(tp):
              start = one(tp, f"SELECT MIN(ts) AS t FROM slice WHERE name = 'launching: {APP}'")
              ready = one(tp, f"SELECT MIN(slice.ts + slice.dur) AS t FROM slice {IN_APP} AND slice.name = 'Plasma.ready' AND slice.ts >= {start}")
              end = ready or one(tp, f"SELECT MIN(slice.ts) AS t FROM slice {IN_APP} AND slice.name LIKE 'reportFullyDrawn() for %'")
              print(f"   launch to {'Plasma.ready' if ready else 'reportFullyDrawn'}: {(end - start) / 1e6:.0f} ms")
              print("   Plasma's own sections then, from the launch:")
              for row in tp.query(f"SELECT slice.name AS s, slice.ts AS ts, slice.dur AS dur, thread.name AS th FROM slice {IN_APP} AND slice.name LIKE 'Plasma.%' AND slice.ts BETWEEN {start} AND {end} ORDER BY slice.ts LIMIT 30"):
                  print(f"     at {(row.ts - start) / 1e6:6.0f} ms for {row.dur / 1e6:5.0f} ms  {row.s} on {row.th}")
              # 100 ms a character: how much of it each thread ran.
              step = 100_000_000
              n = int((end - start) // step) + 1
              busy = {}
              for row in tp.query(f"SELECT thread.name AS name, sched.ts AS ts, sched.dur AS dur FROM sched JOIN thread USING(utid) JOIN process USING(upid) WHERE process.name = '{APP}' AND sched.ts < {end} AND sched.ts + sched.dur > {start}"):
                  part = busy.setdefault(row.name or "?", [0] * n)
                  at, until = max(row.ts, start), min(row.ts + row.dur, end)
                  while at < until:
                      i = int((at - start) // step)
                      took = min(until, start + (i + 1) * step) - at
                      part[i] += took
                      at += took
              mark = lambda share: " " if share < 0.02 else "." if share < 0.25 else ":" if share < 0.5 else "+" if share < 0.75 else "#"
              print("   Plasma's threads running, 100 ms a character, a | each second (. under a quarter of it, : under a half, + under three quarters, # more):")
              print(f"     {'':16s} {''.join('|' if i % 10 == 0 else ' ' for i in range(n))}")
              for name, part in sorted(busy.items(), key=lambda item: -sum(item[1]))[:10]:
                  print(f"     {name[:16]:16s} {''.join(mark(took / step) for took in part)}  {sum(part) / 1e6:5.0f} ms")
              moments = [
                  ("first frame drawn", one(tp, f"SELECT MIN(slice.ts + slice.dur) AS t FROM slice {IN_APP} AND thread.name = 'RenderThread' AND slice.name LIKE 'DrawFrame%' AND slice.ts >= {start}")),
                  ("first live world", one(tp, f"SELECT MIN(slice.ts + slice.dur) AS t FROM slice {IN_APP} AND slice.name = 'Plasma.liveWorld' AND slice.ts >= {start}")),
              ]
              for label, at in moments:
                  if at is not None:
                      print(f"     {label} at {(at - start) / 1e6:.0f} ms")
              print("   its main thread's time then:")
              for row in tp.query(f"SELECT thread_state.state AS s, SUM(MIN(thread_state.ts + thread_state.dur, {end}) - MAX(thread_state.ts, {start})) / 1e6 AS ms FROM thread_state JOIN thread USING(utid) JOIN process USING(upid) WHERE process.name = '{APP}' AND thread.tid = process.pid AND thread_state.ts < {end} AND thread_state.ts + thread_state.dur > {start} GROUP BY s ORDER BY ms DESC"):
                  print(f"     {row.ms:7.0f} ms  {row.s}")
              print("   its main thread's longest sections then, at the top and within them:")
              for depth in ("= 0", "> 0"):
                  totals = {}
                  for row in tp.query(f"SELECT slice.name AS s, slice.dur AS dur FROM slice {IN_APP} AND thread.tid = process.pid AND slice.depth {depth} AND slice.ts BETWEEN {start} AND {end}"):
                      name = re.sub(r"\d+", "N", row.s or "?")[:70]
                      ms, count = totals.get(name, (0, 0))
                      totals[name] = (ms + row.dur / 1e6, count + 1)
                  for name, (ms, count) in sorted(totals.items(), key=lambda item: -item[1][0])[:12]:
                      print(f"     {ms:7.0f} ms  {count:4d} × {name}")
                  print("     --")

          def own_time(tp, thread, label):
              totals = {}
              for row in tp.query(f"""
                  SELECT s.name AS s, s.dur - COALESCE(c.inside, 0) AS own
                  FROM slice s JOIN thread_track ON s.track_id = thread_track.id JOIN thread USING(utid) JOIN process USING(upid)
                  LEFT JOIN (SELECT parent_id, SUM(dur) AS inside FROM slice WHERE parent_id IS NOT NULL GROUP BY parent_id) c ON c.parent_id = s.id
                  WHERE process.name = '{APP}' AND {thread} AND s.dur > 0
              """):
                  name = re.sub(r"\d+", "N", row.s or "?") if not re.search(r"\.kt:\d+\)$", row.s or "") else row.s
                  name = name[:100]
                  ms, count = totals.get(name, (0, 0))
                  totals[name] = (ms + row.own / 1e6, count + 1)
              composed = sum(1 for name in totals if re.search(r" \(\w+\.kt:\d+\)$", name))
              print(f"   its {label}'s own time by section" + (f", {composed} of them composables:" if composed else ":"))
              for name, (ms, count) in sorted(totals.items(), key=lambda item: -item[1][0])[:30]:
                  print(f"     {ms:8.1f} ms  {count:6d} × {name}")

          # The frames with the most work on the main thread, each with its own time by section: what
          # a screen composes and lays out in the frame that opens it, or that moves the Guide's
          # window. A frame's work is its time less its wait for the RenderThread, which on an
          # emulator is most of a frame that draws much; a frame's two slices count once.
          def long_frames(tp, most=4):
              first = one(tp, "SELECT MIN(ts) AS t FROM slice")
              main = f"FROM slice {IN_APP} AND thread.tid = process.pid"
              frames = {}
              for row in tp.query(f"SELECT slice.ts AS ts, slice.dur AS dur {main} AND slice.name LIKE 'Choreographer#doFrame%' AND slice.name NOT LIKE '%resynced%' AND slice.dur > 0"):
                  key = row.ts // 1_000_000
                  if key not in frames or row.dur > frames[key][1]:
                      frames[key] = (row.ts, row.dur)
              waits = [(row.ts, row.dur) for row in tp.query(f"SELECT slice.ts AS ts, slice.dur AS dur {main} AND slice.name = 'postAndWait'")]
              worked = []
              for ts, dur in frames.values():
                  waited = sum(d for t, d in waits if t >= ts and t + d <= ts + dur)
                  worked.append((dur - waited, ts, dur))
              for work, ts, dur in sorted(sorted(worked, reverse=True)[:most], key=lambda frame: frame[1]):
                  totals = {}
                  for row in tp.query(f"""
                      SELECT s.name AS s, s.dur - COALESCE(c.inside, 0) AS own
                      FROM slice s JOIN thread_track ON s.track_id = thread_track.id JOIN thread USING(utid) JOIN process USING(upid)
                      LEFT JOIN (SELECT parent_id, SUM(dur) AS inside FROM slice WHERE parent_id IS NOT NULL GROUP BY parent_id) c ON c.parent_id = s.id
                      WHERE process.name = '{APP}' AND thread.tid = process.pid AND s.dur > 0 AND s.ts >= {ts} AND s.ts + s.dur <= {ts + dur} AND s.name != 'postAndWait'
                  """):
                      name = re.sub(r"\d+", "N", row.s or "?") if not re.search(r"\.kt:\d+\)$", row.s or "") else row.s
                      name = name[:100]
                      ms, count = totals.get(name, (0, 0))
                      totals[name] = (ms + row.own / 1e6, count + 1)
                  print(f"   a main-thread frame of {work / 1e6:.0f} ms of work ({dur / 1e6:.0f} ms with its wait for the drawing), {(ts - first) / 1e6:.0f} ms into the trace: its own time by section, {len(totals)} sections:")
                  for name, (ms, count) in sorted(totals.items(), key=lambda item: -item[1][0])[:60]:
                      print(f"     {ms:8.1f} ms  {count:6d} × {name}")

          # A first-open test's three keys (it opens a screen, goes back to Home, and opens the screen
          # again): the main thread's frames after each, their work without its wait for the drawing,
          # and that work's own time by section. In every one of a test's traces, so that two ways
          # of doing the same thing can be told apart by more than one run of each: a line for the
          # [first] after the key, where the screen it brings comes, a line for the [within] after
          # it, where the screen it leaves has gone too, and the frames one by one. Then what the
          # main thread ran outside its frames (the coroutines a composition launches run right after
          # its frame, in a message with no section of its own), and, in a run with the main thread's
          # stack sampled, the stacks it had there: a frame is class.method:line in the build's names.
          def after_keys(tp, first=250_000_000, within=700_000_000):
              main = f"FROM slice {IN_APP} AND thread.tid = process.pid"
              keys = [row.ts for row in tp.query("SELECT ts FROM slice WHERE name = 'Plasma.keyToDraw' AND dur > 0 ORDER BY ts")]
              if len(keys) < 3:
                  print(f"   ({len(keys)} key sections: not an opening, a return and an opening again)")
                  return
              frames = {}
              for row in tp.query(f"SELECT slice.ts AS ts, slice.dur AS dur {main} AND slice.name LIKE 'Choreographer#doFrame%' AND slice.name NOT LIKE '%resynced%' AND slice.dur > 0"):
                  at = row.ts // 1_000_000
                  if at not in frames or row.dur > frames[at][1]:
                      frames[at] = (row.ts, row.dur)
              waits = [(row.ts, row.dur) for row in tp.query(f"SELECT slice.ts AS ts, slice.dur AS dur {main} AND slice.name = 'postAndWait'")]
              short = lambda name: re.sub(r"\d+", "N", name or "?")[:44]
              # Every section of the main thread's from the first key on, once, with its own time.
              sections = sorted((row.ts, row.dur, short(row.s), row.own) for row in tp.query(f"""
                  SELECT s.ts AS ts, s.dur AS dur, s.name AS s, s.dur - COALESCE(c.inside, 0) AS own
                  FROM slice s JOIN thread_track ON s.track_id = thread_track.id JOIN thread USING(utid) JOIN process USING(upid)
                  LEFT JOIN (SELECT parent_id, SUM(dur) AS inside FROM slice WHERE parent_id IS NOT NULL GROUP BY parent_id) c ON c.parent_id = s.id
                  WHERE process.name = '{APP}' AND thread.tid = process.pid AND s.dur > 0 AND s.name != 'postAndWait' AND s.ts >= {keys[0]} AND s.ts < {keys[-1] + 2 * within}
              """))
              starts = [section[0] for section in sections]
              running, samples = [], []
              try:
                  running = [(row.ts, row.ts + row.dur) for row in tp.query(f"""
                      SELECT thread_state.ts AS ts, thread_state.dur AS dur FROM thread_state JOIN thread USING(utid) JOIN process USING(upid)
                      WHERE process.name = '{APP}' AND thread.tid = process.pid AND thread_state.state = 'Running' AND thread_state.dur > 0
                        AND thread_state.ts + thread_state.dur > {keys[0]} AND thread_state.ts < {keys[-1] + 2 * within}
                  """)]
                  for row in tp.query(f"SELECT slice.ts AS ts, slice.name AS name FROM slice {IN_APP} AND thread.name = 'Plasma samples' ORDER BY slice.ts"):
                      if (row.name or "").startswith("S "):
                          samples.append((row.ts, row.name[2:].split("|")))
                      elif (row.name or "").startswith("+ ") and samples:
                          samples[-1][1].extend(row.name[2:].split("|"))
              except Exception as error:
                  print("   (the main thread's running and its samples couldn't be read: " + str(error).splitlines()[0] + ")")
              ran = lambda a, b: sum(max(0, min(b, end) - max(a, start)) for start, end in running) / 1e6
              apart = sorted(b[0] - a[0] for a, b in zip(samples, samples[1:]) if b[0] - a[0] < 20_000_000)
              every = apart[len(apart) // 2] / 1e6 if apart else 0.0
              for label, key in zip(("opening", "returning", "reopening"), (keys[0], keys[1], keys[-1])):
                  works = []
                  for ts, dur in sorted((ts, dur) for ts, dur in frames.values() if key <= ts < key + within):
                      own = {}
                      for at, took, name, mine in sections[bisect.bisect_left(starts, ts):bisect.bisect_right(starts, ts + dur)]:
                          if at + took <= ts + dur:
                              own[name] = own.get(name, 0) + mine / 1e6
                      work = (dur - sum(d for t, d in waits if t >= ts and t + d <= ts + dur)) / 1e6
                      works.append((ts, work, own))
                  for span in (first, within):
                      totals, inside = {}, [frame for frame in works if frame[0] < key + span]
                      for _, _, own in inside:
                          for name, ms in own.items():
                              totals[name] = totals.get(name, 0) + ms
                      top = ", ".join(f"{name} {ms:.1f}" for name, ms in sorted(totals.items(), key=lambda item: -item[1])[:7])
                      print(f"   after the {label} key, {span // 1_000_000} ms: {len(inside)} frames, {sum(work for _, work, _ in inside):.0f} ms of work, the longest {max((work for _, work, _ in inside), default=0):.0f} ms: {top}")
                  for ts, work, own in works[:14]:
                      top = ", ".join(f"{name} {ms:.1f}" for name, ms in sorted(own.items(), key=lambda item: -item[1])[:4])
                      print(f"        at {(ts - key) / 1e6:5.0f} ms, {work:5.1f} ms of work: {top}")
                  try:
                      made = sorted((ts, ts + dur) for ts, dur in frames.values() if ts + dur > key and ts < key + within)
                      outside = lambda a, b: ran(a, b) - sum(ran(max(a, start), min(b, end)) for start, end in made if end > a and start < b)
                      gaps = [(ran(a, b), a, b) for a, b in zip([key] + [end for _, end in made], [start for start, _ in made]) if key <= a < b <= key + first]
                      most = max(gaps, default=(0.0, key, key))
                      print(f"   after the {label} key, outside its frames: the main thread ran {outside(key, key + first):.0f} ms in the first {first // 1_000_000} ms and {outside(key, key + within):.0f} ms in the {within // 1_000_000} ms; the most between two frames: {most[0]:.0f} ms running in the {(most[2] - most[1]) / 1e6:.0f} ms from {(most[1] - key) / 1e6:.0f} ms after the key")
                      if samples:
                          between = [stack for at, stack in samples if key <= at < key + first and not any(start <= at < end for start, end in made)]
                          stacks = {}
                          for stack in between:
                              stacks[tuple(stack[:12])] = stacks.get(tuple(stack[:12]), 0) + 1
                          print(f"        its stack outside frames in the first {first // 1_000_000} ms: {len(between)} samples, one every {every:.1f} ms or so; the commonest, top first:")
                          for stack, count in sorted(stacks.items(), key=lambda item: -item[1])[:8]:
                              print(f"        {count:4d} × " + " < ".join(stack))
                          deep = {}
                          for stack in between:
                              for frame in set(stack):
                                  deep[frame] = deep.get(frame, 0) + 1
                          print("        frames in the most of those stacks: " + ", ".join(f"{frame} {count}" for frame, count in sorted(deep.items(), key=lambda item: -item[1])[:24]))
                  except Exception as error:
                      print(f"   (what the main thread ran outside its frames after the {label} key failed: " + str(error).splitlines()[0] + ")")
              # The Guide's day: each read of a guide window in the trace (Plasma.guideDayRead, from
              # its asking to its rows), when it began after the key before it, how long it took,
              # which of Plasma's threads ran meanwhile, and where and for how long its rows were sorted.
              try:
                  reads = [(row.ts, row.dur) for row in tp.query("SELECT ts, dur FROM slice WHERE name = 'Plasma.guideDayRead' AND dur > 0 ORDER BY ts")]
                  counts = [(row.ts, row.name.rsplit(" ", 1)[-1]) for row in tp.query("SELECT ts, name FROM slice WHERE name LIKE 'Plasma.guideDayRows %' ORDER BY ts")]
                  sorts = [(row.ts, row.dur, row.thread) for row in tp.query(f"SELECT slice.ts AS ts, slice.dur AS dur, thread.name AS thread FROM slice {IN_APP} AND slice.name = 'Plasma.guideWindow' AND slice.dur > 0 ORDER BY slice.ts")]
                  labels = ["opening", "returning"] + ["a later"] * (len(keys) - 3) + ["reopening"]
                  for ts, dur in reads:
                      before = [(key, label) for key, label in zip(keys, labels) if key <= ts]
                      when = f"{(ts - before[-1][0]) / 1e6:.0f} ms after the {before[-1][1]} key" if before else f"{(keys[0] - ts) / 1e6:.0f} ms before the opening key"
                      rows = next((count for at, count in counts if ts <= at <= ts + dur + 5_000_000), "?")
                      ran = ", ".join(f"{row.name} {row.ran / 1e6:.0f}" for row in tp.query(f"""
                          SELECT thread.name AS name, SUM(MIN(thread_state.ts + thread_state.dur, {ts + dur}) - MAX(thread_state.ts, {ts})) AS ran
                          FROM thread_state JOIN thread USING(utid) JOIN process USING(upid)
                          WHERE process.name = '{APP}' AND thread_state.state = 'Running' AND thread_state.dur > 0
                            AND thread_state.ts < {ts + dur} AND thread_state.ts + thread_state.dur > {ts}
                          GROUP BY thread.utid ORDER BY ran DESC LIMIT 5
                      """))
                      after = next(((at, took, thread) for at, took, thread in sorts if at >= ts + dur - 1_000_000), None)
                      sorted_on = f"; its rows sorted for {after[1] / 1e6:.1f} ms on {after[2]}" if after and after[0] < ts + dur + 500_000_000 else ""
                      print(f"   the Guide's day: a read of {rows} rows began {when} and took {dur / 1e6:.0f} ms; running meanwhile, ms: {ran}{sorted_on}")
              except Exception as error:
                  print("   (the Guide's day couldn't be read: " + str(error).splitlines()[0] + ")")

          traces = sorted(glob.glob("benchmark/build/outputs/connected_android_test_additional_output/**/*.perfetto-trace", recursive=True))
          print(len(traces), "traces")
          for path in traces:
              if "FirstOpen" not in path:
                  continue
              print("-- keys of", path.rsplit("/", 1)[-1])
              try:
                  tp = TraceProcessor(trace=path)
                  after_keys(tp)
                  tp.close()
              except Exception as error:
                  print("   (its keys' breakdown failed: " + str(error).splitlines()[0] + ")")
          firsts = {}
          for path in traces:
              firsts.setdefault(re.sub(r"_iter\d+_.*", "", path.rsplit("/", 1)[-1]), path)
          for path in sorted(firsts.values()):
              print("==", path.rsplit("/", 1)[-1])
              tp = TraceProcessor(trace=path)
              for label, sql in checks:
                  try:
                      value = next(iter(tp.query(sql))).n
                  except Exception as error:
                      value = "(" + str(error).splitlines()[0] + ")"
                  print("  ", label + ":", value)
              # A cold start, from Android starting to launch Plasma to Plasma.ready, as its launch
              # screen starts to go: Plasma's own sections, its threads running over time, how its
              # main thread spent the time, and what its main thread did then.
              if "Startup" in path:
                  try:
                      startup(tp)
                  except Exception as error:
                      print("   (start-up's breakdown failed: " + str(error).splitlines()[0] + ")")
              # Where the frames' time went on the main thread: each section's own time, without
              # the sections within it, which with composition tracing names each composable.
              else:
                  for thread, label in (("thread.tid = process.pid", "main thread"), ("thread.name = 'RenderThread'", "RenderThread")):
                      try:
                          own_time(tp, thread, label)
                      except Exception as error:
                          print(f"   (the {label}'s breakdown failed: " + str(error).splitlines()[0] + ")")
                  try:
                      long_frames(tp)
                  except Exception as error:
                      print("   (the longest frames' breakdown failed: " + str(error).splitlines()[0] + ")")
              tp.close()
          EOF
          if [ -f benchmark/build/logcat.txt ]; then
            python3 - <<'EOF'
          import datetime, re

          lines = open("benchmark/build/logcat.txt", errors="replace").read().split("\n")
          stamp = re.compile(r"^(\d\d-\d\d \d\d:\d\d:\d\d\.\d+)")
          worth = re.compile(r"AndroidRuntime|ActivityManager|ActivityTaskManager|Benchmark|ca\.gureet\.plasma|FATAL|lowmemorykiller|Zygote|libc|DEBUG|WindowManager|[Cc]rash|died|[Kk]illed|signal \d+|tombstone")

          def at(line):
              found = stamp.match(line)
              return datetime.datetime.strptime(found.group(1), "%m-%d %H:%M:%S.%f") if found else None

          # A start the benchmarks asked for with no "Fully drawn" before the next one: what the
          # device logged from five seconds before it to a minute after.
          starts = [i for i, line in enumerate(lines) if "Starting activity with command" in line]
          for n, i in enumerate(starts):
              until = starts[n + 1] if n + 1 < len(starts) else len(lines)
              if any("Fully drawn ca.gureet.plasma.benchmark/" in line for line in lines[i:until]):
                  continue
              began = at(lines[i])
              print(f"== A start with no \"Fully drawn\" after it, at {lines[i][:18]}: the device's log around it")
              shown = 0
              for line in lines[max(0, i - 400):until]:
                  when = at(line)
                  if began is None or when is None or not -5 <= (when - began).total_seconds() <= 60:
                      continue
                  if worth.search(line) and "AccessibilityNodeInfoDumper" not in line:
                      print(line[:300])
                      shown += 1
                      if shown >= 250:
                          break
          EOF
            echo "== What the benchmarks logged"
            grep -E "PlasmaBenchmark|Skipping results" benchmark/build/logcat.txt | tail -80
          fi

      # In the run's summary, and in its log.
      - name: Write the results as a table
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json

          # Brief 6.7's budgets for what's measured, in ms: cold start to Home, a key to what it
          # changes, and a frame at 60 fps.
          budgets = {"timeToFullDisplayMs": 1500, "startupReadyMs": 1500, "keyToDrawAverageMs": 100, "keyToDrawMaxMs": 100, "frameDurationCpuMs": 16.7}
          fmt = lambda v: "" if v is None else f"{v:,.1f}"
          rows = []
          for path in sorted(glob.glob("benchmark/build/outputs/connected_android_test_additional_output/**/*benchmarkData.json", recursive=True)):
              data = json.load(open(path))
              for benchmark in data.get("benchmarks", []):
                  name = benchmark["className"].rsplit(".", 1)[-1] + "." + benchmark["name"]
                  for metric, values in benchmark.get("metrics", {}).items():
                      rows.append((name, metric, f"median {fmt(values.get('median'))}, {fmt(values.get('minimum'))} to {fmt(values.get('maximum'))}", budgets.get(metric)))
                  for metric, values in benchmark.get("sampledMetrics", {}).items():
                      rows.append((name, metric, ", ".join(f"{p} {fmt(values.get(p))}" for p in ("P50", "P90", "P95", "P99") if p in values), budgets.get(metric)))
          print("## Benchmarks on the emulator")
          print()
          if not rows:
              print("No results: see the job's log.")
          else:
              print("An Android TV emulator on GitHub's machines, not a TV box: compare runs with each other. Times in ms.")
              print()
              print("| Benchmark | Metric | Measured | Budget (6.7) |")
              print("|---|---|---|---|")
              for name, metric, measured, budget in rows:
                  print(f"| {name} | {metric} | {measured} | {'' if budget is None else budget} |")
          EOF

      # The results only: the traces would fill the small artifact store.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: benchmark-results
          path: benchmark/build/outputs/connected_android_test_additional_output/**/*.json
          if-no-files-found: ignore
          retention-days: 7

  # Plasma's benchmark build and the benchmarks, to install on a TV over adb (docs/testing.md,
  # "Benchmarks on the TV"): each run adds its own, beside the earlier ones.
  for-a-tv:
    if: ${{ inputs.for_a_tv }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Fetch Gradle
        run: |
          for wait in 15 45 90 180; do
            ./gradlew --version --console=plain && exit 0
            echo "Fetching Gradle failed; trying again in $wait s"
            sleep "$wait"
          done
          ./gradlew --version --console=plain

      - name: Build Plasma's benchmark build and the benchmarks
        run: ./gradlew $GRADLE_RETRIES :app:assembleBenchmark :benchmark:assembleBenchmark --console=plain

      # The app for 32-bit TVs, as the Chromecast with Google TV is, and for 64-bit ones, and the
      # benchmarks. The two are signed with the same new debug key, so they go together.
      - name: Put them on the Plasma Benchmarks pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${GITHUB_RUN_NUMBER}"
          mkdir -p "$RUNNER_TEMP/tv"
          ls app/build/outputs/apk/benchmark benchmark/build/outputs/apk/benchmark
          cp app/build/outputs/apk/benchmark/*armeabi-v7a*.apk "$RUNNER_TEMP/tv/plasma-benchmark-$n-32-bit.apk"
          cp app/build/outputs/apk/benchmark/*arm64-v8a*.apk "$RUNNER_TEMP/tv/plasma-benchmark-$n-64-bit.apk"
          cp benchmark/build/outputs/apk/benchmark/*.apk "$RUNNER_TEMP/tv/plasma-benchmark-$n-tests.apk"
          if ! gh release view benchmarks > /dev/null 2>&1; then
            gh release create benchmarks --prerelease --title "Plasma Benchmarks" \
              --notes "Plasma's benchmark build and its benchmarks (#127), for measuring brief 6.7's budgets on a TV over adb, as docs/testing.md's \"Benchmarks on the TV\" says. Each run adds its three files, numbered: the app for a 32-bit or a 64-bit TV, and the tests. Not an app to keep: take both away afterwards." \
              --target "$GITHUB_SHA"
          fi
          gh release upload benchmarks "$RUNNER_TEMP"/tv/*.apk
          echo "::notice title=Plasma Benchmarks::plasma-benchmark-$n-*.apk (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})."
