name: Build

on:
  push:
    branches: [main]
  # Only pull requests into main build by themselves. One stacked on another branch is checked on
  # the developer's machine before it's pushed, and built here by hand when its APK is wanted
  # (Actions › Build › Run workflow): the free plan has 2,000 minutes a month, and a build takes
  # about 25.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: Record the screens' reference images instead of building, and put the changed ones on the "Recorded screens" pre-release, to check and commit
        type: boolean
        default: false

permissions:
  contents: write

env:
  # GitHub's release downloads, where Plasma's libmpv comes from, sometimes answer 504 for minutes.
  # Gradle tries resolving a dependency three times, from a second apart; this makes it six, from
  # two seconds, doubling, about two minutes in all. Gradle takes these only on its command line,
  # not from gradle.properties.
  GRADLE_RETRIES: -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=2000

concurrency:
  group: build-${{ github.ref }}-${{ inputs.record_screenshots || false }}
  cancel-in-progress: true

jobs:
  # Robolectric's Android can't always be downloaded where the code is written (Maven Central
  # throttles it), so a screen changed on purpose gets its new reference image here. Nothing is
  # committed: the images are checked against their boards, then committed by hand.
  record:
    if: ${{ inputs.record_screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The wrapper downloads Gradle from GitHub's releases without trying again, and they
      # sometimes answer 504 for a while: try a few times, waiting longer each time.
      - name: Fetch Gradle
        run: |
          for wait in 15 45 90 180; do
            ./gradlew --version --console=plain && exit 0
            echo "Fetching Gradle failed; trying again in $wait s"
            sleep "$wait"
          done
          ./gradlew --version --console=plain

      - name: Record the reference images
        run: ./gradlew $GRADLE_RETRIES recordRoborazziDebug --continue --console=plain

      - name: Put the changed images on the Recorded screens pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(git status --porcelain --untracked-files=all -- '*/src/test/screenshots/*.png' | awk '{print $NF}')
          if [ -z "$changed" ]; then
            echo "::notice title=Recorded screens::No reference image changed."
            exit 0
          fi
          name="screens-${GITHUB_RUN_NUMBER}.zip"
          zip -q "$name" $changed
          if ! gh release view screens > /dev/null 2>&1; then
            gh release create screens --prerelease --title "Recorded screens" \
              --notes "Reference images recorded by CI for branches whose screens changed on purpose: each file is one run's changed images, to check against the boards and commit by hand. Not an app build." \
              --target "$GITHUB_SHA"
          fi
          gh release upload screens "$name"
          echo "::notice title=Recorded screens::$(echo "$changed" | wc -l) images in $name (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})."

  build:
    if: ${{ !inputs.record_screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The wrapper downloads Gradle from GitHub's releases without trying again, and they
      # sometimes answer 504 for a while: try a few times, waiting longer each time.
      - name: Fetch Gradle
        run: |
          for wait in 15 45 90 180; do
            ./gradlew --version --console=plain && exit 0
            echo "Fetching Gradle failed; trying again in $wait s"
            sleep "$wait"
          done
          ./gradlew --version --console=plain

      - name: Show Kotlin errors as annotations
        run: echo "::add-matcher::.github/kotlin-problem-matcher.json"

      - name: Unit tests, and screens compared with their reference images
        run: ./gradlew $GRADLE_RETRIES testDebugUnitTest -Proborazzi.test.verify=true --continue --console=plain

      - name: Android Lint
        run: ./gradlew $GRADLE_RETRIES :app:lintDebug --console=plain

      - name: Annotate failed tests
        if: failure()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/**/*.xml'
          annotate_only: true

      # A step shows at most ten annotations, so ten failed screenshots can hide a real failure:
      # one more annotation names every failed test.
      - name: List every failed test
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          failed = []
          for path in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append(case.get("classname", "").rsplit(".", 1)[-1] + "." + case.get("name", ""))
          if failed:
              print(f"::error title={len(failed)} failed tests::" + ", ".join(sorted(failed)))
          EOF

      - name: Keep screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: screenshot-differences
          path: '**/build/outputs/roborazzi/**'
          if-no-files-found: ignore
          retention-days: 7

      # What Large Text and Android's own font size would cut off on each screen (#128), from the
      # screen tests: a list to work through, which fails nothing yet.
      - name: Text that larger fonts would cut off
        if: always()
        run: |
          find . -path '*/build/large-text/*.txt' | sort | while read -r file; do
            echo "== ${file#./}"
            cat "$file"
          done

      - name: Decode the dev signing key
        if: env.DEV_KEYSTORE_BASE64 != ''
        run: |
          echo "$DEV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plasma-dev.jks"
          echo "PLASMA_DEV_KEYSTORE=$RUNNER_TEMP/plasma-dev.jks" >> "$GITHUB_ENV"
          echo "::notice title=Signing::Plasma Dev is signed with the dev key."

      - name: Note a missing dev key
        if: env.DEV_KEYSTORE_BASE64 == ''
        run: echo "::warning title=Signing::The DEV_* secrets aren't set, so Plasma Dev is signed with a throwaway debug key."

      - name: Build Plasma Dev
        env:
          PLASMA_DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          PLASMA_DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          PLASMA_DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
          PLASMA_VERSION_CODE: ${{ github.run_number }}
        # The update file goes with the APKs, for the in-app updater (brief 5.18), and so do the
        # baseline profiles it names, which Android's installer compiles an update with: it points
        # at the build's own pre-release, dev-N for a build on main and test-N for one started by hand.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release="test-${GITHUB_RUN_NUMBER}"
            notes="Plasma Dev test build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME}), from ${GITHUB_SHA::7}."
          else
            release="dev-${GITHUB_RUN_NUMBER}"
            notes="Plasma Dev build ${GITHUB_RUN_NUMBER}, from ${GITHUB_SHA::7}."
          fi
          ./gradlew $GRADLE_RETRIES :app:assembleDev :app:verifyDevCxxRuntime :app:writeDevUpdateFile --console=plain \
            -Pplasma.updateBase="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release}" \
            -Pplasma.updateNotes="${notes}"

      - uses: actions/upload-artifact@v7
        # The free plan stores 500 MB of artifacts, and a build's APKs are about 170 MB, so the store
        # can be full: the build still counts, and a build on main, or one started by hand, has its
        # APKs on a pre-release instead, which doesn't use the store.
        continue-on-error: true
        with:
          name: plasma-dev
          path: app/build/outputs/apk/dev/*.apk
          if-no-files-found: error
          # A week. Builds on main stay on their pre-release.
          retention-days: 7

      - name: Publish a dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DEV_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="dev-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/dev/*.apk app/build/outputs/update/dev/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "Plasma Dev build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build of ${GITHUB_SHA::7} from main. Installs as Plasma Dev (ca.gureet.plasma.dev)."

      - name: Publish a test pre-release
        # A build started by hand is one the owner wants to install before it's merged.
        if: github.event_name == 'workflow_dispatch' && env.DEV_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/dev/*.apk app/build/outputs/update/dev/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "Plasma Dev test build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Built by hand from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}, to try before it's merged. Installs as Plasma Dev (ca.gureet.plasma.dev)."

      - name: Offer it in Plasma Update
        # Plasma Dev reads update.json from the "dev" pre-release: it offers the newest build, on main
        # or started by hand (the owner's ask, 1 November). Builds can finish out of order, so an
        # older one leaves a newer one's file there.
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && env.DEV_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dev > /dev/null 2>&1; then
            gh release create dev --prerelease --target "$GITHUB_SHA" \
              --title "Plasma Dev: the newest build" \
              --notes "Plasma Dev checks update.json here for its updates. The APKs are in each build's own pre-release."
          fi
          offered=$(gh release download dev --pattern update.json --output - 2>/dev/null \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["versionCode"])' 2>/dev/null || echo 0)
          if [ "${GITHUB_RUN_NUMBER}" -gt "${offered:-0}" ]; then
            gh release upload dev app/build/outputs/update/dev/update.json --clobber
          else
            echo "::notice title=Plasma Update::It already offers build ${offered}, newer than this one."
          fi

      - name: Attach R8's mapping, for crash reports from the TV
        # R8 shortens Plasma Dev's names, so a crash report from the TV reads "zl1.b"; with this
        # file, R8's retrace turns them back. Zipped, it's a few MB. A failure here leaves the
        # APKs on their pre-release.
        if: env.DEV_KEYSTORE_BASE64 != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag="test-${GITHUB_RUN_NUMBER}"; else tag="dev-${GITHUB_RUN_NUMBER}"; fi
          gzip -9 -c app/build/intermediates/mapping/dev/minifyDevWithR8/mapping.txt > "$RUNNER_TEMP/mapping-${GITHUB_RUN_NUMBER}.txt.gz"
          gh release upload "$tag" "$RUNNER_TEMP/mapping-${GITHUB_RUN_NUMBER}.txt.gz"
