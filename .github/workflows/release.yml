name: Release

# Pushing a version tag (v1.0.0) builds Plasma from it, signs it with the release key, and puts it
# on a draft GitHub Release to install and look over: publishing the draft makes it public. The
# release key is in the "release" environment, which only v* tags can use, so no branch or pull
# request build can read it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # As in build.yml: GitHub's release downloads sometimes answer 504 for minutes.
  GRADLE_RETRIES: -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=2000
  # The release key's certificate: every APK has to be signed with exactly this one.
  RELEASE_CERT_SHA256: 46:16:1D:5A:33:14:8F:B5:8A:A8:BB:99:4B:D7:5A:BA:84:55:77:7D:4D:C0:E3:43:F8:CB:6A:41:A8:F5:52:4C

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag is Plasma's version
        run: |
          version=$(sed -n 's/^val plasmaVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error title=Version::The tag is ${GITHUB_REF_NAME}, but app/build.gradle.kts says ${version}."
            exit 1
          fi
          if [ ! -f "docs/releases/${version}.md" ]; then
            echo "::error title=Notes::There are no release notes: docs/releases/${version}.md."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # A release starts from a clean build, and leaves nothing for the dev builds' cache.
          cache-disabled: true

      - name: Fetch Gradle
        run: |
          for wait in 15 45 90 180; do
            ./gradlew --version --console=plain && exit 0
            echo "Fetching Gradle failed; trying again in $wait s"
            sleep "$wait"
          done
          ./gradlew --version --console=plain

      - name: Decode the release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error title=Signing::The release environment has no RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plasma-release.jks"

      - name: Build Plasma
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # The update file names the release's own address for each APK and profile; the first
        # paragraph of the notes is what Plasma Update shows.
        run: |
          summary=$(awk '/^[^#[:space:]]/ { print; exit }' "docs/releases/${VERSION}.md")
          ./gradlew $GRADLE_RETRIES :app:assembleRelease :app:verifyReleaseCxxRuntime :app:writeReleaseUpdateFile --console=plain \
            -Pplasma.release.storeFile="$RUNNER_TEMP/plasma-release.jks" \
            -Pplasma.release.storePassword="$STORE_PASSWORD" \
            -Pplasma.release.keyAlias="$KEY_ALIAS" \
            -Pplasma.release.keyPassword="$KEY_PASSWORD" \
            -Pplasma.updateBase="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            -Pplasma.updateNotes="${summary}"
          rm -f "$RUNNER_TEMP/plasma-release.jks"

      - name: Check the APKs are signed with the release key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          want=$(echo "$RELEASE_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          count=0
          for apk in app/build/outputs/apk/release/*.apk; do
            # apksigner names each signer by scheme ("V2 Signer: certificate SHA-256 digest: …"):
            # every one has to be the release key.
            got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
            if [ "$got" != "$want" ]; then
              echo "::error title=Signing::$apk is signed with ${got:-no key}, not the release key."
              exit 1
            fi
            count=$((count + 1))
          done
          [ "$count" -eq 3 ] || { echo "::error title=APKs::Expected three APKs, found $count."; exit 1; }

      - name: Check the APKs for 16 KB pages
        run: python3 tools/check_16kb.py app/build/outputs/apk/release/*.apk

      - name: Put it on a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp app/build/outputs/apk/release/*.apk app/build/outputs/update/release/* "$out"/
          gzip -9 -c app/build/intermediates/mapping/release/minifyReleaseWithR8/mapping.txt > "$out/mapping-${VERSION}.txt.gz"
          (cd "$out" && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "$out"/* --draft --verify-tag \
            --title "Plasma ${VERSION}" --notes-file "docs/releases/${VERSION}.md"
          echo "::notice title=Draft release::Plasma ${VERSION} is a draft on the Releases page: install it, then publish it there."
