name: Plasma Remote release

# Pushing a Plasma Remote tag (remote-v0.1.0) builds both apps from it (brief 5.22 and 6.11):
# the Android app signed with Plasma Remote's own release key, on a draft GitHub Release that
# isn't marked as the latest (Plasma's TV releases stay that), and the iPhone app signed and sent
# to App Store Connect for TestFlight. The keys are in the "remote-release" environment, which
# only remote-v* tags can use, so no branch or pull request build can read them.
on:
  push:
    tags: ['remote-v*']

permissions:
  contents: write

env:
  GRADLE_RETRIES: -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=2000
  # Plasma Remote's release key's certificate (SHA-256): every APK has to be signed with exactly
  # this one. Filled in when the key is made (docs/decisions.md, "Plasma Remote's releases").
  REMOTE_CERT_SHA256: ''

concurrency:
  group: remote-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Both apps say the tag's version, and it has release notes.
      - name: Check the tag is Plasma Remote's version
        id: check
        run: |
          version=$(sed -n 's/^val remoteVersion = "\(.*\)"$/\1/p' phone/androidApp/build.gradle.kts)
          ios=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' phone/iosApp/project.yml)
          if [ "${GITHUB_REF_NAME}" != "remote-v${version}" ]; then
            echo "::error title=Version::The tag is ${GITHUB_REF_NAME}, but phone/androidApp/build.gradle.kts says ${version}."
            exit 1
          fi
          if [ "$ios" != "$version" ]; then
            echo "::error title=Version::phone/iosApp/project.yml says ${ios}, the Android app ${version}."
            exit 1
          fi
          if [ ! -f "docs/releases/remote-${version}.md" ]; then
            echo "::error title=Notes::There are no release notes: docs/releases/remote-${version}.md."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: remote-release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Decode the release key
        env:
          REMOTE_KEYSTORE_BASE64: ${{ secrets.REMOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$REMOTE_KEYSTORE_BASE64" ] || [ -z "$REMOTE_CERT_SHA256" ]; then
            echo "::error title=Signing::The remote-release environment needs REMOTE_KEYSTORE_BASE64, and this workflow REMOTE_CERT_SHA256."
            exit 1
          fi
          echo "$REMOTE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/remote-release.jks"

      - name: Build the Android app
        env:
          STORE_PASSWORD: ${{ secrets.REMOTE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REMOTE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REMOTE_KEY_PASSWORD }}
        run: |
          ./gradlew -p phone $GRADLE_RETRIES :androidApp:assembleRelease --console=plain \
            -Premote.release.storeFile="$RUNNER_TEMP/remote-release.jks" \
            -Premote.release.storePassword="$STORE_PASSWORD" \
            -Premote.release.keyAlias="$KEY_ALIAS" \
            -Premote.release.keyPassword="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/remote-release.jks"

      - name: Check the APK is signed with the release key, and has its resources
        run: |
          apk=phone/androidApp/build/outputs/apk/release/androidApp-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          want=$(echo "$REMOTE_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
          if [ "$got" != "$want" ]; then
            echo "::error title=Signing::$apk is signed with ${got:-no key}, not Plasma Remote's release key."
            exit 1
          fi
          unzip -l "$apk" | grep -q 'assets/composeResources/.*/values/strings.commonMain.cvr'

      - name: Put it on a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp phone/androidApp/build/outputs/apk/release/androidApp-release.apk "$out/plasma-remote-${VERSION}.apk"
          gzip -9 -c phone/androidApp/build/outputs/mapping/release/mapping.txt > "$out/plasma-remote-mapping-${VERSION}.txt.gz"
          (cd "$out" && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "$out"/* --draft --verify-tag --latest=false \
            --title "Plasma Remote ${VERSION}" --notes-file "docs/releases/remote-${VERSION}.md"
          echo "::notice title=Draft release::Plasma Remote ${VERSION} is a draft on the Releases page: install it, then publish it there."

  ios:
    name: iPhone
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    environment: remote-release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd phone/iosApp && xcodegen

      # The App Store Connect API key signs the build (Xcode makes the certificate and profile it
      # needs) and uploads it.
      - name: The App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "::error title=Signing::The remote-release environment needs APP_STORE_CONNECT_KEY, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APPLE_TEAM_ID."
            exit 1
          fi
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string app-store-connect "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert destination -string upload "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$RUNNER_TEMP/ExportOptions.plist"

      # The build number goes up with every run of this workflow, as App Store Connect needs.
      - name: Build, sign and send to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd phone/iosApp
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project PlasmaRemote.xcodeproj -scheme PlasmaRemote -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PlasmaRemote.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            "${auth[@]}" archive | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PlasmaRemote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}" | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "::notice title=TestFlight::Plasma Remote ${VERSION} (${GITHUB_RUN_NUMBER}) went to App Store Connect: it shows in TestFlight once Apple has processed it."
