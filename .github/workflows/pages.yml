name: Website

# Publishes site/, the project's website (brief 6.11), to GitHub Pages. A pull request that changes
# the site is checked; a change that reaches main, or a run started by hand (Actions › Website ›
# Run workflow), is checked and published. The repository's Pages source has to be "GitHub
# Actions" (Settings › Pages) for the publish job to work.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site_check.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site_check.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the site's links, pictures and files
        run: python3 tools/site_check.py

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publish at a time, and none stopped half-way by the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
