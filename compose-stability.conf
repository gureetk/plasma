// Classes the Compose compiler treats as stable in every module (the compose convention plugin
// adds this file). A composable given a stable value equal to the last one skips; given one of a
// class it can't tell is immutable, it compares instances, and an equal value made anew (a time
// worked out again as a screen recomposes) redoes all it shows.
//
// java.time's values are immutable: Instant, LocalDate, ZonedDateTime, ZoneId, Duration and the rest.
java.time.*
