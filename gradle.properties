org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The GitHub repository whose Releases hold the updates (brief 5.18). CI says it itself.
plasma.repository=gureetk/plasma

# GitHub's release downloads, where Plasma's libmpv comes from, sometimes answer 504 for a while.
# Gradle tries a download three times, a second apart and doubling; six times from two seconds
# rides out a bad few minutes. These are the names Gradle 9 reads (NetworkOperationBackOffAndRetry).
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
