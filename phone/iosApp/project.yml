# Plasma Remote for iPhone (brief 5.22). XcodeGen makes the Xcode project from this file
# (`brew install xcodegen`, then `xcodegen` in this folder), so no project file is kept here.
name: PlasmaRemote
options:
  bundleIdPrefix: ca.gureet.plasma
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PlasmaRemote:
    type: application
    platform: iOS
    sources:
      - PlasmaRemote
    settings:
      base:
        PRODUCT_NAME: PlasmaRemote
        PRODUCT_BUNDLE_IDENTIFIER: ca.gureet.plasma.remote
        INFOPLIST_FILE: PlasmaRemote/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
        # The shared framework has the Apple-silicon simulator only (iosSimulatorArm64).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      # The shared Kotlin code, built by Gradle as the framework "Shared" for this build's SDK.
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew -p phone :shared:embedAndSignAppleFrameworkForXcode
